<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Poverty Statistics by Country</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="d-flex align-items-center gap-2">
        <h1 class="h4 mb-0">Poverty Statistics & Nonprofits</h1>
      </div>
      <div id="summaryKpi" class="text-secondary small">—</div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <label for="countryInput" class="form-label mb-2">Country</label>
        <div class="position-relative">
          <div class="input-group">
            <input class="form-control" id="countryInput" placeholder="Start typing">
            <button id="fetchBtn" class="btn btn-primary" type="button">Search</button>
          </div>
          <div id="suggestions" class="sugg-box d-none" role="listbox" aria-label="Country suggestions"></div>
        </div>
      </div>
    </div>


    <div class="card mt-3 shadow-sm">
      <div class="card-body">
        <div id="countryLabel" class="text-secondary small mb-3">Country: —</div>

        <div class="row g-3">
          <div class="col-12 col-lg-4">
            <div id="chartCard" class="card h-100 d-none">
              <div class="card-body">
                <div class="d-flex align-items-center justify-content-between mb-2">
                  <h2 class="h6 mb-0">Poverty headcount (% under $2.15/day)</h2>
                  <small class="text-secondary" id="chartMeta">—</small>
                </div>
                <div style="height:300px">
                  <canvas id="povertyChart"></canvas>
                </div>
                <div id="chartEmpty" class="alert alert-secondary mt-2 d-none">
                  No poverty data available.
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-8">
            <div id="error" class="alert alert-danger d-none"></div>
            <div id="empty" class="alert alert-secondary d-none">No nonprofits found for this country.</div>
            <div id="cards" class="row g-3 d-none"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="index.js" defer></script>
</body>
</html>
